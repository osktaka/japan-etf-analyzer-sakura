services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8902:8902"
    env_file:
      - .env
    environment:
      - APP_BASE_DIR=/app
      - STRATEGY_FILE=/app/docs/12_personal_strategy.md
      - ADVISOR_REPORTS_DIR=/app/reports/test/daily-tasks
      - ADVISOR_USER_ID=test
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/scripts:/app/scripts
      - ./backend/config:/app/config
      - ./logs:/app/logs
      - ./backend/data:/app/data
      - ./reports:/app/reports
      - ./docs:/app/docs:ro
      - ./frontend/dist:/app/frontend/dist
    command: flask run --host=0.0.0.0 --port=8902

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3902:3902"
    environment:
      - VITE_API_URL=http://localhost:8902
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/package.json:/app/package.json
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/vitest.config.ts:/app/vitest.config.ts
    depends_on:
      - backend

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8902:8902"
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/scripts:/app/scripts
      - ./logs:/app/logs
      - ./backend/data:/app/data
      - ./reports:/app/reports
    command: flask run --host=0.0.0.0 --port=8902

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3902:3902"
    environment:
      - VITE_API_URL=http://localhost:8902
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/package.json:/app/package.json
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/vitest.config.ts:/app/vitest.config.ts
    depends_on:
      - backend

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.scheduler
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src
      - ./backend/scripts:/app/scripts
      - ./logs:/app/logs
      - ./backend/data:/app/data
    depends_on:
      - backend
    restart: unless-stopped

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8902:8902"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - DATABASE_URL=sqlite:////app/data/etf.db
      - USE_MOCK_DATA=false
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/scripts:/app/scripts
      - ./logs:/app/logs
      - backend_data:/app/data
    command: flask run --host=0.0.0.0 --port=8902

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3902:3902"
    environment:
      - VITE_API_URL=http://localhost:8902
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/package.json:/app/package.json
      - ./frontend/vitest.config.ts:/app/vitest.config.ts
    depends_on:
      - backend

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.scheduler
    environment:
      - DATABASE_URL=sqlite:////app/data/etf.db
      - FLASK_APP=src/app.py
    volumes:
      - ./backend/src:/app/src
      - ./backend/scripts:/app/scripts
      - ./logs:/app/logs
      - backend_data:/app/data
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:

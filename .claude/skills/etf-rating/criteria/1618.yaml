code: "1618"
name: "NEXT FUNDS エネルギー資源(TOPIX-17)上場投信"
version: "2026-05-22_v1"
horizon: "中期（3〜12ヶ月）"
sector: "エネルギー資源（石油・ガス・石炭）"
benchmark_index: "TOPIX-17 エネルギー資源"
top_holdings:
  - "INPEX"
  - "ENEOSホールディングス"
  - "出光興産"
  - "コスモエネルギーホールディングス"
  - "石油資源開発"
notes: |
  日本のエネルギー資源セクター（石油元売り＋上流権益＋ガス）に集中投資するETF。
  時価総額構成は INPEX（上流権益・LNG）と ENEOS（精製・元売り）の2社で半分超を占める。
  ドライバーは (1) 原油価格（Brent/Dubai）、(2) LNG価格、(3) OPEC+減産動向、(4) 中東地政学、(5) USD/JPY。
  精製マージン（クラックスプレッド）の動向が ENEOS・出光・コスモの利益に直結。
  2014-16 シェール革命局面で -50%、2020/3 コロナで -45%、2022 ウクライナ侵攻で +60% など、コモディティ価格に強く連動。
  デフォルトで分割なし。1629（商社）と原油・LNG感応度で重複するが、1618 は元売り・上流に純粋特化。

top5_drivers: ["A-1", "A-2", "A-3", "A-4", "A-5"]
top5_risk_drivers: ["B-1", "B-2", "B-3", "B-4", "B-8"]

upside_conditions:
  - id: "A-1"
    description: "原油価格上昇（Brent/Dubai/WTI）"
    type: "leading"
    thresholds:
      brent_oil_usd:
        strong_bullish: ">=100"
        bullish: ">=85"
        neutral: "70-85"
        bearish: "<70"
      dubai_oil_usd:
        strong_bullish: ">=95"
        bullish: ">=80"
        neutral: "65-80"
        bearish: "<65"
    data_sources:
      - "WebSearch:Brent原油 価格 直近"
      - "WebSearch:Dubai 原油 価格"
      - "WebSearch:WTI 原油 価格"
    past_cases:
      - "2008/7 Brent $147最高値"
      - "2022/3 Brent $130（ウクライナ）"
      - "2024 ホルムズ封鎖長期化"

  - id: "A-2"
    description: "LNG/天然ガス価格上昇（JKM・TTF）"
    type: "leading"
    thresholds:
      jkm_lng_usd:
        strong_bullish: ">=15"
        bullish: ">=12"
        neutral: "8-12"
        bearish: "<8"
      ttf_eu_gas_usd:
        strong_bullish: ">=18"
        bullish: ">=14"
        neutral: "10-14"
        bearish: "<10"
    data_sources:
      - "WebSearch:JKM LNG スポット 価格"
      - "WebSearch:TTF オランダ 天然ガス"
      - "WebSearch:LNG 需給 アジア"
    past_cases:
      - "2022/8 JKM $52超（ウクライナ）"
      - "2021/12 アジア寒波"

  - id: "A-3"
    description: "OPEC+減産・生産規律維持"
    type: "leading"
    thresholds:
      opec_compliance_pct:
        strong_bullish: ">=110"
        bullish: ">=100"
        neutral: "90-100"
        bearish: "<90"
    data_sources:
      - "WebSearch:OPEC 減産 自主減産"
      - "WebSearch:サウジ ロシア OPEC+"
      - "WebSearch:OPEC compliance rate"
    past_cases:
      - "2020/4 大型協調減産で原油底打ち"
      - "2023-24 サウジ自主減産延長"

  - id: "A-4"
    description: "地政学リスク（中東・ホルムズ・ロシア）"
    type: "leading"
    thresholds:
      geopolitical_risk_index:
        strong_bullish: ">=200"
        bullish: ">=120"
        neutral: "80-120"
        bearish: "<80"
    data_sources:
      - "WebSearch:中東 戦争 イラン イスラエル"
      - "WebSearch:ホルムズ海峡 封鎖"
      - "WebSearch:ウクライナ ロシア エネルギー"
    past_cases:
      - "1990/8 湾岸危機"
      - "2022/2 ウクライナ侵攻"
      - "2024 ホルムズ封鎖長期化"

  - id: "A-5"
    description: "USD/JPY円安進行（円建て換算利益拡大）"
    type: "leading"
    thresholds:
      usd_jpy:
        strong_bullish: ">=155"
        bullish: ">=145"
        neutral: "135-145"
        bearish: "<135"
    data_sources:
      - "WebSearch:ドル円 為替"
      - "WebSearch:日銀 政策金利"
    past_cases:
      - "2022-24 円安進行で元売り好業績"

  - id: "A-6"
    description: "国内エネルギー需要安定（電力・産業向け）"
    type: "lagging"
    thresholds:
      japan_oil_demand_yoy_pct:
        strong_bullish: ">=+3"
        bullish: ">=0"
        neutral: "-3〜0"
        bearish: "<-3"
    data_sources:
      - "WebSearch:日本 石油 需要"
      - "WebSearch:資源エネルギー庁 石油統計"
      - "WebSearch:LNG 火力発電 比率"
    past_cases:
      - "2011-15 原発停止でLNG需要急増"

  - id: "A-7"
    description: "石油元売り精製マージン拡大（クラックスプレッド）"
    type: "leading"
    thresholds:
      crack_spread_singapore_usd:
        strong_bullish: ">=15"
        bullish: ">=10"
        neutral: "5-10"
        bearish: "<5"
    data_sources:
      - "WebSearch:シンガポール クラックスプレッド"
      - "WebSearch:精製マージン 直近"
      - "WebSearch:ENEOS 精製"
    past_cases:
      - "2022 ロシア制裁で精製マージン急拡大"

  - id: "A-8"
    description: "上流権益評価益・LNGプロジェクト稼働"
    type: "lagging"
    thresholds:
      inpex_upstream_profit_yoy_pct:
        strong_bullish: ">=+20"
        bullish: ">=+10"
        neutral: "0〜+10"
        bearish: "<0"
    data_sources:
      - "WebSearch:INPEX 決算 上流"
      - "WebSearch:LNG プロジェクト 稼働"
      - "WebSearch:イクシス LNG"
    past_cases:
      - "2018 イクシスLNG生産開始"
      - "2022 LNG高値で上流利益最大化"

  - id: "A-9"
    description: "ガス自由化フェーズ完了・小売シェア確立"
    type: "lagging"
    thresholds:
      gas_retail_share_change_yoy_pp:
        strong_bullish: ">=+2"
        bullish: ">=+1"
        neutral: "0〜+1"
        bearish: "<0"
    data_sources:
      - "WebSearch:ガス 小売 自由化"
      - "WebSearch:エネルギー 小売 シェア"
    past_cases:
      - "2017 ガス小売全面自由化"

  - id: "A-10"
    description: "政府の戦略備蓄拡大・エネルギー安保政策"
    type: "lagging"
    thresholds:
      strategic_reserve_release_announce_count_6m:
        strong_bullish: "0（=備蓄積み増し局面）"
        bullish: "0"
        neutral: "1"
        bearish: ">=2（=放出局面）"
    data_sources:
      - "WebSearch:日本 戦略石油備蓄"
      - "WebSearch:エネルギー基本計画"
      - "WebSearch:GX 投資 政府"
    past_cases:
      - "2022 SPR放出局面（米国主導）"


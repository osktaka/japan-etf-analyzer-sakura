        strong_bearish: ">=5.5"
        bearish: ">=5.0"
        neutral: "4.5-5.0"
        bullish: "<4.5"
    data_sources:
      - "WebSearch:FRB FF金利 利上げ"
      - "WebSearch:FRB タカ派"

    thresholds:
      global_pmi_manufacturing:
        strong_bearish: "<45"
        bearish: "<48"
        neutral: "48-50"
        bullish: ">=50"
    data_sources:
      - "WebSearch:世界 製造業 PMI"
      - "WebSearch:OECD 景気先行指数"

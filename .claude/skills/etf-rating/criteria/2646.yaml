    thresholds:
      sumitomo_metal_pbr:
        strong_bearish: ">=2.0"
        bearish: ">=1.5"
        neutral: "1.0-1.5"
        bullish: "<1.0"
    data_sources:
      - "WebSearch:住友金属鉱山 PBR"

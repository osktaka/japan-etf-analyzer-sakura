  - id: "B-8"
    description: "在庫過剰（LME在庫急増・コンタンゴ拡大）"
    type: "leading"
    thresholds:
      copper_lme_stock_change_3m_pct:
        strong_bearish: ">=+30"
        bearish: ">=+15"
        neutral: "0〜+15"
        bullish: "<0"
    data_sources:

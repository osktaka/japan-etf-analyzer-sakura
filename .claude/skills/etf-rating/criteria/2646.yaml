scenarios:
  base:
    name: "基本シナリオ（銅$4.5前後・中国PMI50超維持）"
    description: "銅 $4.5/lb・ニッケル $18000・中国製造業PMI 50超・USD/JPY 150円台・EVシェア20%。"
    expected_return_pct: "+8〜+18"
  upside:
    name: "上振れシナリオ（銅スーパーサイクル＋中国景気加速）"
    description: "銅 $5.5超＋中国財政出動＋EV/再エネ加速＋鉱山供給制約。非鉄全般+30%級。"
    expected_return_pct: "+25〜+40"
  downside:
    name: "下振れシナリオ（中国不動産危機悪化＋EV鈍化＋ドル高）"
    description: "中国不動産深刻化＋EV補助金縮小＋FRBタカ派＋DXY 110突破。非鉄-25〜-35%急落。"
    expected_return_pct: "-25〜-35"


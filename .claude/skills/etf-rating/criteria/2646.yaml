    thresholds:
      china_home_price_yoy_pct:
        strong_bearish: "<=-8"
        bearish: "<=-5"
        neutral: "-5〜0"
        bullish: ">0"
      china_steel_production_yoy_pct:
        strong_bearish: "<=-8"
        bearish: "<=-3"
        neutral: "-3〜0"

scenarios:
  base:
    name: "基本シナリオ（AI需要継続＋USD/JPY 150円台）"
    description: "NVIDIA売上前年比+25%・TSMC設備投資+10%・HBM需給タイト・USD/JPY 150円台・米中規制据え置き。"

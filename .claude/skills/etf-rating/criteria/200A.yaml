  - id: "A-5"
    description: "米中半導体規制緩和・台湾安定"
    type: "leading"
    thresholds:
      export_restriction_announce_count_6m:
        strong_bullish: "削減 or 撤廃"
        bullish: "据え置き"
        neutral: "1件追加"
        bearish: ">=2件追加"
    data_sources:

code: "200A"
name: "NEXT FUNDS 日経半導体株指数連動型上場投信"
version: "2026-05-22_v1"
horizon: "中期（3〜12ヶ月）"
sector: "国内半導体（製造装置・材料・デバイス）"
benchmark_index: "日経半導体株指数（東証上場の半導体関連30銘柄を等ウェイトに近い構成）"
top_holdings:
  - "東京エレクトロン（前工程装置）"
  - "アドバンテスト（テスタ）"
  - "ディスコ（後工程装置）"
  - "信越化学工業 / SUMCO（シリコンウェハ）"
  - "ルネサスエレクトロニクス / ローム（デバイス）"
  - "レーザーテック（マスク検査）"
notes: |
  日本の半導体関連30銘柄に投資する円建てETF。
  時価総額構成は東京エレクトロン・アドバンテスト・信越化学・SUMCOなどの製造装置・材料メーカーが中核。
  ドライバーは (1) NVIDIA決算/AI需要、(2) TSMC/Samsung設備投資、(3) HBM/DRAM需給、(4) USD/JPY、(5) 米中半導体規制。
  製造装置メーカーは2-3四半期先行で動く。NVIDIA決算が短期センチメントを支配。
  2022 半導体サイクル底打ち→2023-24 AIブームで+200%級の上昇後、2024/7 急落、その後再上昇。
  最大DD 2022/1→2022/10 約-45%、2024/7-8 約-30%。バリュエーション PER 30倍超の過熱局面あり。
  デフォルトで分割なし。出来高は活発。

top5_drivers: ["A-1", "A-2", "A-3", "A-4", "A-9"]
top5_risk_drivers: ["B-1", "B-2", "B-3", "B-5", "B-9"]

upside_conditions:
  - id: "A-1"
    description: "AI需要拡大（NVIDIA決算・ハイパースケーラーCapEx）"
    type: "leading"
    thresholds:
      nvidia_yoy_revenue_pct:
        strong_bullish: ">=50"
        bullish: ">=25"
        neutral: "0-25"
        bearish: "<0"
      hyperscaler_capex_yoy_pct:
        strong_bullish: ">=30"
        bullish: ">=15"
        neutral: "5-15"
        bearish: "<5"
    data_sources:
      - "WebSearch:NVIDIA 決算 売上 ガイダンス"
      - "WebSearch:Microsoft Google Meta CapEx"
      - "WebSearch:AI データセンター 投資"
    past_cases:
      - "2023/5 NVIDIA AI元年（+24%/単日）"
      - "2024 ハイパースケーラーCapEx 1700億ドル"

  - id: "A-2"
    description: "HBM/DRAM需給タイト化・価格上昇"
    type: "leading"
    thresholds:
      dram_contract_price_yoy_pct:
        strong_bullish: ">=+30"
        bullish: ">=+15"
        neutral: "0〜+15"
        bearish: "<0"
      hbm_capacity_utilization_pct:
        strong_bullish: ">=95"
        bullish: ">=90"
        neutral: "85-90"
        bearish: "<85"
    data_sources:
      - "WebSearch:DRAM 価格 直近"
      - "WebSearch:HBM 需給 SK Micron Samsung"
      - "WebSearch:TrendForce メモリ価格"
    past_cases:
      - "2017-18 DRAMスーパーサイクル"
      - "2024 HBM需給逼迫でAI半導体急騰"

  - id: "A-3"
    description: "半導体設備投資拡大（WFE市場）"
    type: "leading"
    thresholds:
      global_wfe_yoy_pct:
        strong_bullish: ">=+15"
        bullish: ">=+5"
        neutral: "-5〜+5"
        bearish: "<-5"
    data_sources:
      - "WebSearch:WFE 半導体製造装置 市場"
      - "WebSearch:SEMI WFE forecast"
      - "WebSearch:東京エレクトロン 受注"

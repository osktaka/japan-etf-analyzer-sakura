      - "2024 AI向け装置投資加速"

  - id: "A-4"
    description: "TSMC設備投資ガイダンス上方修正"
    type: "leading"
    thresholds:
      tsmc_capex_yoy_pct:
        strong_bullish: ">=+20"
        bullish: ">=+10"
        neutral: "0〜+10"

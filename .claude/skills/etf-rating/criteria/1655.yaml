        strong_bearish: ">=5.5"
        bearish: ">=5.0"
        neutral: "4.5-5.0"
        bullish: "<4.5"
      core_pce_yoy_pct:
        strong_bearish: ">=4.0"
        bearish: ">=3.5"
        neutral: "2.5-3.5"
        bullish: "<2.5"
    data_sources:
      - "WebSearch:FRB FF金利 利上げ"
      - "WebSearch:米国 コアPCE インフレ"
      - "WebSearch:FOMC タカ派"
    past_cases:
      - "2022 アグレッシブ利上げ→-25%急落"

  - id: "B-3"
    description: "USD/JPY円高進行（円換算リターン圧迫）"
    type: "leading"
    thresholds:
      usd_jpy:
        strong_bearish: "<140"
        bearish: "<148"
        neutral: "148-155"
        bullish: ">=155"
    data_sources:

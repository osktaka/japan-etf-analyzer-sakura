scenarios:
  base:
    name: "基本シナリオ（ソフトランディング継続）"
    description: "FRB緩慢な利下げ＋EPS堅調＋USD/JPY 150円台維持。AI投資鈍化なくPER 20倍前後で安定推移。"
    expected_return_pct: "+8〜+18"
  upside:
    name: "上振れシナリオ（AIブーム加速＋利下げ＋円安）"
    description: "FRB予想以上の利下げ＋NVIDIA上方修正連鎖＋USD/JPY 160円台復帰。バリュエーション拡大で年間+25%以上。"
    expected_return_pct: "+25〜+40"
  downside:
    name: "下振れシナリオ（リセッション＋AIバブル崩壊＋円高）"
    description: "ISM45割れ＋NVIDIA決算ピークアウト＋USD/JPY 140円割れ。三重苦で-25〜-35%急落。"
    expected_return_pct: "-25〜-35"

revision_history:
  - date: "2026-05-22"
    note: "初版。S&P500連動・円換算ETFとして為替を最重要ドライバーに位置付け。"

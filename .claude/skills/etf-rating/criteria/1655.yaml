  - id: "B-7"
    description: "地政学ショック（戦争・テロ・選挙混乱）"
    type: "leading"
    thresholds:
      vix_spike_to:
        strong_bearish: ">=35"
        bearish: ">=28"
        neutral: "22-28"
        bullish: "<22"
    data_sources:
      - "WebSearch:中東 戦争 拡大"
      - "WebSearch:台湾 有事"

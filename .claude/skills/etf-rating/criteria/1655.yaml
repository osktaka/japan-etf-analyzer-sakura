      - "2021末 PER22→2022 -25%調整"

  - id: "B-10"
    description: "ETF特有のトラッキングエラー・為替コスト増"
    type: "lagging"
    thresholds:
      tracking_error_yoy_pp:
        strong_bearish: ">=1.0"
        bearish: ">=0.5"
        neutral: "0.2-0.5"
        bullish: "<0.2"
    data_sources:

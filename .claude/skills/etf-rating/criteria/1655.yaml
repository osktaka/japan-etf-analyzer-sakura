    type: "leading"
    thresholds:
      nvidia_yoy_revenue_pct:
        strong_bearish: "<=10"
        bearish: "<=20"
        neutral: "20-40"
        bullish: ">40"
      hyperscaler_capex_yoy_pct:
        strong_bearish: "<0"
        bearish: "<5"
        neutral: "5-15"
        bullish: ">=15"
    data_sources:
      - "WebSearch:NVIDIA 決算 ガイダンス"
      - "WebSearch:Microsoft Meta CapEx 減速"
      - "WebSearch:AI バブル"
    past_cases:
      - "2000 ドットコムバブル崩壊"
      - "2022 メタバース失速"

  - id: "B-5"
    description: "S&P500 EPSピークアウト・決算下方修正連鎖"
    type: "lagging"
    thresholds:
      sp500_eps_revision_3m:
        strong_bearish: "<=-5"
        bearish: "<=-2"
        neutral: "-2〜0"
        bullish: ">0"
    data_sources:
      - "WebSearch:S&P500 EPS 下方修正"
      - "WebSearch:FactSet earnings revision negative"
    past_cases:
      - "2008-09 EPS-30%下方修正"
      - "2022下半期 EPSピークアウト"

  - id: "B-6"
    description: "信用スプレッド拡大（HY 500bp超）"
    type: "leading"
    thresholds:
      hy_spread_bp:
        strong_bearish: ">=700"
        bearish: ">=500"
        neutral: "350-500"
        bullish: "<350"
    data_sources:
      - "WebSearch:HY スプレッド OAS"
      - "WebSearch:CDX HY 直近"

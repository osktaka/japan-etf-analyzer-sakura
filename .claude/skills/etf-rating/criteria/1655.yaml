  - id: "B-9"
    description: "バリュエーション過熱（PER25超・ERP圧縮）"
    type: "leading"
    thresholds:
      sp500_forward_per:
        strong_bearish: ">=25"
        bearish: ">=22"
        neutral: "18-22"
        bullish: "<18"
      equity_risk_premium_bp:
        strong_bearish: "<=100"
        bearish: "<=200"
        neutral: "200-400"
        bullish: ">400"
    data_sources:

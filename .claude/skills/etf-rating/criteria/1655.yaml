  - id: "B-8"
    description: "米中緊張再燃（追加関税・半導体規制）"
    type: "leading"
    thresholds:
      tariff_change_announcement:
        strong_bearish: "全面的上げ"
        bearish: "限定的上げ"
        neutral: "据え置き"
        bullish: "削減"
    data_sources:
